<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hania, I'm Really Sorry ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --rose: #ff4d85;
      --deep: #c2185b;
      --blush: #fff0f5;
      --plum: #4a1130;
      --gold: #ffd166;
      --ys: 1
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      -webkit-tap-highlight-color: transparent
    }

    body {
      font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      color: var(--plum);
      background: linear-gradient(-45deg, #ff9a9e, #ff5e9c, #ff8fb8, #ffb3c9, #ff5e9c);
      background-size: 400% 400%;
      animation: grad 10s ease infinite;
      overflow-x: hidden;
      position: relative
    }

    @keyframes grad {
      50% {
        background-position: 100% 50%
      }
    }

    .bg {
      position: fixed;
      bottom: -60px;
      opacity: .28;
      pointer-events: none;
      animation: rise linear infinite;
      z-index: 0
    }

    @keyframes rise {
      to {
        transform: translateY(-115vh) rotate(40deg)
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 40px);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, .9);
      box-shadow: 0 30px 80px rgba(194, 24, 91, .35);
      animation: enter .9s cubic-bezier(.2, 1.2, .4, 1)
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(40px) scale(.92)
      }
    }

    .hidden {
      display: none !important
    }

    .mood {
      font-size: clamp(3.4rem, 14vw, 5rem);
      line-height: 1;
      display: inline-block;
      animation: bob 2.2s ease-in-out infinite;
      cursor: pointer;
      user-select: none
    }

    @keyframes bob {
      50% {
        transform: translateY(-10px) rotate(-6deg)
      }
    }

    h1 {
      font-family: 'Pacifico', 'Brush Script MT', cursive;
      font-weight: 400;
      font-size: clamp(1.7rem, 6.4vw, 2.7rem);
      line-height: 1.35;
      color: var(--deep);
      margin: 10px 0 8px;
      min-height: 2.7em;
      display: flex;
      align-items: center;
      justify-content: center
    }

    h1.shake {
      animation: shake .45s
    }

    @keyframes shake {
      25% {
        transform: translateX(-8px) rotate(-2deg)
      }

      75% {
        transform: translateX(8px) rotate(2deg)
      }
    }

    .sub {
      font-size: clamp(.95rem, 3.5vw, 1.1rem);
      opacity: .8;
      margin-bottom: 14px
    }

    .arena {
      position: relative;
      height: 250px;
      margin: 6px 0 4px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 6px;
      touch-action: manipulation
    }

    @media(max-width:560px) {
      .arena {
        height: 290px
      }
    }

    button {
      font-family: inherit;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      transition: transform .2s, box-shadow .2s
    }

    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px
    }

    #yesBtn {
      font-size: clamp(1.05rem, 4.4vw, 1.35rem);
      padding: 16px 30px;
      color: #fff;
      background: linear-gradient(135deg, #ff6fa5, #e0116b);
      transform: scale(var(--ys));
      transform-origin: center top;
      animation: glow 1.8s ease-in-out infinite;
      position: relative;
      z-index: 3
    }

    #yesBtn:hover {
      transform: translateY(-4px) scale(calc(var(--ys)*1.05))
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 8px 22px rgba(224, 17, 107, .4)
      }

      50% {
        box-shadow: 0 8px 40px rgba(224, 17, 107, .8)
      }
    }

    #noBtn {
      position: absolute;
      font-size: clamp(.95rem, 3.8vw, 1.15rem);
      padding: 13px 24px;
      color: #7a3b55;
      background: #ffe3ec;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
      transition: left .35s cubic-bezier(.3, 1.5, .5, 1), top .35s cubic-bezier(.3, 1.5, .5, 1), transform .3s;
      z-index: 2;
      white-space: nowrap
    }

    .meter {
      max-width: 340px;
      margin: 6px auto 0
    }

    .meter small {
      display: block;
      font-size: .85rem;
      opacity: .75;
      margin-bottom: 5px
    }

    .track {
      height: 12px;
      border-radius: 99px;
      background: #ffd6e4;
      overflow: hidden
    }

    #bar {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #ffb3c9, #e0116b);
      transition: width .4s
    }

    #clickCount {
      margin-top: 14px;
      min-height: 28px;
      font-weight: 500;
      color: var(--deep);
      font-size: 1.02rem
    }

    /* after view */
    #after h2 {
      font-family: 'Pacifico', cursive;
      font-weight: 400;
      color: var(--deep);
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      line-height: 1.3;
      margin: 6px 0 12px
    }

    .letter {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      line-height: 1.7;
      font-size: clamp(.98rem, 3.6vw, 1.1rem);
      min-height: 150px;
      box-shadow: inset 0 0 0 2px #ffd6e4;
      text-align: left
    }

    .letter b {
      display: block;
      text-align: right;
      color: var(--deep);
      margin-top: 8px;
      font-weight: 600
    }

    h3 {
      margin: 22px 0 10px;
      font-size: 1.1rem;
      font-weight: 600
    }

    .coupons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    .cp {
      perspective: 700px;
      height: 112px
    }

    .cp .in {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .6s;
      transform-style: preserve-3d
    }

    .cp.flip .in {
      transform: rotateY(180deg)
    }

    .cp .f,
    .cp .b {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-weight: 500;
      font-size: .95rem;
      line-height: 1.3
    }

    .cp .f {
      background: linear-gradient(135deg, #ff8fb8, #ff5e9c);
      color: #fff;
      font-size: 1.05rem
    }

    .cp .f span {
      font-size: 2rem
    }

    .cp .b {
      background: #fff;
      border: 2px dashed var(--rose);
      transform: rotateY(180deg);
      color: var(--plum)
    }

    .cp .b span {
      font-size: 1.8rem
    }

    .heartzone {
      margin-top: 6px
    }

    #bigHeart {
      font-size: clamp(4.5rem, 20vw, 6.5rem);
      background: none;
      line-height: 1;
      filter: drop-shadow(0 8px 14px rgba(224, 17, 107, .4));
      animation: beat 1.3s ease-in-out infinite;
      user-select: none
    }

    #bigHeart:active {
      transform: scale(.88)
    }

    @keyframes beat {

      0%,
      100% {
        transform: scale(1)
      }

      15% {
        transform: scale(1.14)
      }

      30% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.1)
      }
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .pill {
      padding: 12px 22px;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, #ff6fa5, #e0116b);
      box-shadow: 0 6px 16px rgba(224, 17, 107, .3)
    }

    .pill:hover {
      transform: translateY(-3px)
    }

    .pill.alt {
      background: #fff;
      color: var(--deep);
      box-shadow: inset 0 0 0 2px var(--rose)
    }

    /* fx */
    .cf {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1000;
      animation: fall var(--d) ease-in forwards
    }

    @keyframes fall {
      to {
        transform: translate(var(--dx), 110vh) rotate(var(--r))
      }
    }

    .pop {
      position: fixed;
      pointer-events: none;
      z-index: 1001;
      animation: pop 1s ease-out forwards;
      font-size: 1.6rem
    }

    @keyframes pop {
      to {
        transform: translate(var(--tx), var(--ty)) scale(.6);
        opacity: 0
      }
    }

    .trail {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      font-size: 1rem;
      animation: tr .9s ease-out forwards
    }

    @keyframes tr {
      to {
        transform: translateY(-30px) scale(.3);
        opacity: 0
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 120px);
      z-index: 1100;
      background: var(--plum);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: .98rem;
      max-width: 90vw;
      text-align: center;
      transition: transform .45s cubic-bezier(.2, 1.4, .4, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3)
    }

    .toast.show {
      transform: translate(-50%, 0)
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(74, 17, 48, .55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .backdrop.show {
      display: flex
    }

    .modal {
      background: #fff;
      border-radius: 28px;
      padding: 30px 24px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
      animation: mpop .5s cubic-bezier(.2, 1.5, .4, 1)
    }

    @keyframes mpop {
      from {
        transform: scale(.6) rotate(-4deg);
        opacity: 0
      }
    }

    .modal .em {
      font-size: 3.6rem;
      line-height: 1.1
    }

    .modal h4 {
      font-family: 'Pacifico', cursive;
      font-weight: 400;
      font-size: 1.5rem;
      color: var(--deep);
      margin: 8px 0
    }

    .modal p {
      line-height: 1.55;
      margin-bottom: 18px
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01s !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01s !important
      }
    }
  </style>
</head>

<body>

  <main class="card" id="card">
    <div class="mood" id="mood" title="Tap me">🥺</div>
    <h1 id="mainText">Hania, I'm really sorry ❤️<br>Please forgive me, I really hurt you mera bachaa🥺</h1>
    <p class="sub" id="sub">One tiny click is all I need, Meri Jaaan</p>
    <div class="arena" id="arena">
      <button id="yesBtn">Okay baby, I forgive you 💖</button>
      <button id="noBtn">No, I'm still angry 😠</button>
    </div>
    <div class="meter"><small>My Bachaa's sadness level 🙃</small>
      <div class="track"><i id="bar"></i></div>
    </div>
    <div id="clickCount"></div>
  </main>

  <section class="card hidden" id="after">
    <div class="mood">🥰</div>
    <h2>Yay! Meri Jaaan forgave me!</h2>
    <div class="letter"><span id="letterText"></span></div>

    <h3>Gifts for you mera babyyyy 🎁💗 (tap to open)</h3>
    <div class="coupons" id="coupons"></div>

    <h3>Tap the heart to count your love meri jaaaaannnn 💗</h3>
    <div class="heartzone">
      <button id="bigHeart" aria-label="Send love">💖</button>
      <div id="loveCount" style="font-weight:500;color:var(--deep)">Love sent: 0</div>
    </div>
    <div class="row">
      <button class="pill" id="reasonBtn">Why I love you 💌</button>
      <button class="pill" id="hugBtn">Send a hug 🫂❤️ </button>
      <button class="pill alt" id="replayBtn">Replay 🔁</button>
    </div>
  </section>

  <div class="backdrop" id="backdrop">
    <div class="modal" id="modal">
      <div class="em" id="mEm">💋❤️</div>
      <h4 id="mTitle"></h4>
      <p id="mText"></p>
      <button class="pill" id="mBtn">Okay</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const mainText = $('mainText'), yesBtn = $('yesBtn'), noBtn = $('noBtn'), arena = $('arena'),
      clickCount = $('clickCount'), bar = $('bar'), mood = $('mood');
    const rnd = a => a[Math.floor(Math.random() * a.length)];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const messages = [
      "Hania, I'm really sorry ❤️<br>Please forgive me 🥺",
      "Meri Jaaan, I promise I'll improve myself 🥺💕",
      "Hania, you mean the world to me 🌍💖",
      "Mera Bachaa, I love you more than anything 😭❤️",
      "Please forgive me, Meri Haanuuu 🙃❤️",
      "I'll do everything you say, meri Hania 💝",
      "You're the most important person to me 🤌❤️",
      "I fucked up, but I love you so much, Mera Bachaa 💕",
      "Life isn't the same without your smile, Hania 🤌💖",
      "I promise to be better for you, Meri Jaaan ❤️",
      "Forgive me please? I'll buy you Chilli Milli, Hania 💕",
      "I'm so so so sorry, Mera Bachaa 😭❤️",
      "You deserve the world and I'll give it to you, In Sha Allah 🌹💖",
      "Pretty please Meri Jaaan? 🥺",
      "I'll make you my wife, Hania, I promise 💍❤️"
    ];
    const noLabels = ["No, I'm still angry 😠", "Are you sure? 🤨", "Really, Hania? 🥺", "Think again 😤", "Okay maybe 🙄", "I'm weakening 😳", "Please stop 😅"];
    const moods = ["🥺", "😔", "🙃", "😭", "🥺", "🙁", "🥺"];
    const toasts = {
      3: "Even the teddy is sad now, meri Hanuuuu 🧸💔",
      6: "Meri Jaaan, the sadness meter is rising 🥺",
      10: "My baby is not giving up 💪❤️",
      14: "Hania, the Yes button is getting huge, hehe😏"
    };
    let tries = 0, msgIdx = 0;

    /* floating background hearts */
    ['❤️', '💖', '💕', '💗', '💝', '🌸'].forEach((e, i) => { });
    for (let i = 0; i < 16; i++) {
      const h = document.createElement('div'); h.className = 'bg';
      h.textContent = rnd(['❤️', '💖', '💕', '💗', '💝', '🌸', '✨']);
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (1 + Math.random() * 2) + 'rem';
      h.style.animationDuration = (10 + Math.random() * 14) + 's';
      h.style.animationDelay = (-Math.random() * 20) + 's';
      document.body.appendChild(h);
    }

    /* effects */
    function burst(x, y, n = 10, set = ['💖', '✨', '💕', '💗']) {
      if (reduce) return;
      for (let i = 0; i < n; i++) {
        const p = document.createElement('div'); p.className = 'pop'; p.textContent = rnd(set);
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
        p.style.left = x + 'px'; p.style.top = y + 'px';
        p.style.setProperty('--tx', Math.cos(a) * d + 'px'); p.style.setProperty('--ty', Math.sin(a) * d + 'px');
        document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
      }
    }
    function confetti(n = 90) {
      if (reduce) return;
      const cols = ['#ff4d85', '#ffd166', '#fff', '#ff8fb8', '#c2185b', '#ffb3c9'];
      for (let i = 0; i < n; i++) {
        const c = document.createElement('i'); c.className = 'cf';
        c.style.left = Math.random() * 100 + 'vw'; c.style.background = rnd(cols);
        c.style.setProperty('--dx', (Math.random() - .5) * 260 + 'px');
        c.style.setProperty('--r', Math.random() * 900 + 'deg');
        c.style.setProperty('--d', (2.4 + Math.random() * 2.4) + 's');
        document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
      }
    }
    function rain(n = 26) {
      if (reduce) return;
      for (let i = 0; i < n; i++) setTimeout(() => {
        const h = document.createElement('div'); h.className = 'bg'; h.style.opacity = .9; h.style.zIndex = 1000;
        h.textContent = rnd(['❤️', '💖', '💕', '💗', '💝', '🥰', '😍']);
        h.style.left = Math.random() * 100 + 'vw'; h.style.fontSize = (1.6 + Math.random() * 1.6) + 'rem';
        h.style.animationDuration = (3 + Math.random() * 2.5) + 's';
        document.body.appendChild(h); setTimeout(() => h.remove(), 6000);
      }, i * 110);
    }
    let tT;
    function toast(t) {
      const el = $('toast'); el.textContent = t; el.classList.add('show');
      clearTimeout(tT); tT = setTimeout(() => el.classList.remove('show'), 2600);
    }
    /* cursor trail (mouse only) */
    let lastTrail = 0;
    addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || reduce) return;
      const now = Date.now(); if (now - lastTrail < 70) return; lastTrail = now;
      const t = document.createElement('div'); t.className = 'trail'; t.textContent = rnd(['💗', '✨', '💕']);
      t.style.left = e.clientX + 'px'; t.style.top = e.clientY + 'px';
      document.body.appendChild(t); setTimeout(() => t.remove(), 900);
    });

    /* popup modal */
    let mCb = null;
    function modal(em, title, text, btn, cb) {
      $('mEm').textContent = em; $('mTitle').textContent = title; $('mText').textContent = text;
      $('mBtn').textContent = btn || 'Okay'; mCb = cb || null;
      $('backdrop').classList.add('show'); $('mBtn').focus();
    }
    function closeModal() { $('backdrop').classList.remove('show'); const f = mCb; mCb = null; if (f) f(); }
    $('mBtn').onclick = closeModal;
    $('backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') closeModal(); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && $('backdrop').classList.contains('show')) closeModal(); });

    /* No button logic */
    function placeNo(random) {
      const a = arena.getBoundingClientRect(), y = yesBtn.getBoundingClientRect();
      const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
      let x, t, tries2 = 0, ov;
      if (!random) { x = Math.max(0, (a.width - w) / 2); t = Math.max(0, a.height - h - 14); }
      else do {
        x = Math.random() * Math.max(1, a.width - w); t = Math.random() * Math.max(1, a.height - h); tries2++;
        const l = a.left + x, r = l + w, tp = a.top + t, bt = tp + h, pad = 18;
        ov = !(r + pad < y.left || l - pad > y.right || bt + pad < y.top || tp - pad > y.bottom);
      } while (ov && tries2 < 80);
      noBtn.style.left = x + 'px'; noBtn.style.top = t + 'px';
    }
    function dodge(e) {
      if (e && e.cancelable) e.preventDefault();
      const b = noBtn.getBoundingClientRect();
      burst(b.left + b.width / 2, b.top + b.height / 2, 6, ['✨', '💔', '🥺']);
      tries++;
      placeNo(true);
      noBtn.style.transform = `scale(${Math.max(.55, 1 - tries * .04)})`;
      noBtn.textContent = noLabels[Math.min(Math.floor(tries / 2), noLabels.length - 1)];
      document.documentElement.style.setProperty('--ys', Math.min(1 + tries * .04, 1.4));
      bar.style.width = Math.min(tries * 7, 100) + '%';
      msgIdx = (msgIdx + 1) % messages.length;
      mainText.innerHTML = messages[msgIdx];
      mainText.classList.remove('shake'); void mainText.offsetWidth; mainText.classList.add('shake');
      mood.textContent = moods[Math.min(Math.floor(tries / 2), moods.length - 1)];
      clickCount.textContent = tries <= 5 ? `Come on, Hania... just click YES 🥺 (Attempts: ${tries})`
        : tries <= 10 ? `Please Meri Jaaan! I'm begging you 😭 (Attempts: ${tries})`
          : `I can do this all day, Mera Bachaa, hehee ❤️ (Attempts: ${tries})`;
      if (toasts[tries]) toast(toasts[tries]);
    }
    noBtn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(e); });
    noBtn.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') dodge(e); });
    noBtn.addEventListener('click', e => { if (e.detail === 0) dodge(e); }); /* keyboard */
    noBtn.addEventListener('focus', () => { if (tries > 0 || document.activeElement === noBtn) { } });
    mood.addEventListener('click', e => { burst(e.clientX, e.clientY, 8); toast('Aww, Hania, you poked Mera Bachaa 🥹'); });
    addEventListener('resize', () => placeNo(false));
    document.fonts && document.fonts.ready.then(() => placeNo(false));
    placeNo(false);

    /* After view */
    const letter = "Haniaaa meri jaaan, you are my peace, you are my comfort zone 🙃❤️. You are my favorite and most important person and my safest place. I'm really really realllyyy sorry mein apko itna zyada hurt kr deta hoon meri jaaannn, but I promise to keep trying to be better for you every single day 🥺💋❤️. Thank you for always giving me another chance and always mujhe smjhny ky liye aur mera sth deny ky liye. In Sha Allah, hum dono nikkah tak ka safar aur end tak sth rhein gy. In Sha Allah In Sha Allah In Sha Allah meri jaaaannn💖";
    const couponData = [
      ["🫂❤️", "Barii saari huggiee"], ["🍦", "Ice cream for you "],
      ["❤️", "I love you from all my heart meri jaaan "], ["💋❤️", "Bariiii sarrriii kissiiiiiiiiiiiiiiiiii"]
    ];
    const reasons = [
      "Your smile fixes my worst days 🌷", "You care so deeply about me, Hania 💕", "Your laugh is my favorite sound 🎶❤️",
      "You make ordinary days feel special ✨❤️", "You are my peace, Meri Jaaan 🤌❤️", "Even your angry face is cute, Hania 😭❤️"
    ];
    let typer, loves = 0;
    function typeLetter() {
      const el = $('letterText'); el.innerHTML = ''; let i = 0; clearInterval(typer);
      typer = setInterval(() => {
        el.textContent = letter.slice(0, ++i);
        if (i >= letter.length) { clearInterval(typer); el.innerHTML = letter + '<b>Always yours, Mera Bachaa 💞</b>'; }
      }, reduce ? 1 : 32);
    }
    function buildCoupons() {
      const c = $('coupons'); c.innerHTML = '';
      couponData.forEach(([e, t]) => {
        const d = document.createElement('div'); d.className = 'cp';
        d.innerHTML = `<div class="in"><div class="f"><span>🎁</span>Tap me</div><div class="b"><span>${e}</span>${t}</div></div>`;
        d.onclick = ev => { d.classList.toggle('flip'); if (d.classList.contains('flip')) burst(ev.clientX, ev.clientY, 8); };
        c.appendChild(d);
      });
    }
    function showAfter() {
      $('card').classList.add('hidden'); $('after').classList.remove('hidden');
      buildCoupons(); typeLetter(); loves = 0; $('loveCount').textContent = 'Love sent: 0';
      scrollTo({ top: 0 });
      document.body.style.alignItems = 'flex-start';
    }
    yesBtn.addEventListener('click', () => {
      confetti(100); rain(26); showAfter();
      setTimeout(() => modal('🥹', 'Thank youuuu, Haniaaaa!', 'You just made Mera Bachaa the happiest person in the whole world.', 'Aww, next 💕',
        () => modal('🤝', 'My promise', 'I will listen more, argue less and make you smile hameshaaa, Meri Jaaan.', 'Accepted ✅',
          () => modal('🤗', 'HUGGIEEEE', 'Come here, meri jaaaaanannnn. Hug. I love you more than anyting mera babyyy 🫂🫂❤️❤️', 'Hug received 💞',
            () => { confetti(60); toast('Now scroll down for more surprises 🎁'); }))), 1400);
    });
    $('bigHeart').addEventListener('click', e => {
      loves++; $('loveCount').textContent = 'Love sent: ' + loves;
      burst(e.clientX, e.clientY, 8);
      if (loves === 10) modal('😍', '10 hearts!', 'Meri Jaaan, you are officially full of love now.', 'Keep going');
      if (loves === 25) modal('🥳', '25 hearts!', 'Hania, my heart is doing flips because of you.', 'More!');
      if (loves === 50) { confetti(120); modal('🏆', '50 hearts!', 'You win, Mera Bachaa is completely yours forever.', 'Always 💖'); }
    });
    $('reasonBtn').addEventListener('click', () => modal('💌', 'Why I love you, (click multiple times)', rnd(reasons), ));
    $('hugBtn').addEventListener('click', e => { burst(e.clientX, e.clientY, 14, ['🤗', '💞', '🧸', '💖']); toast('A big warm hug sent to Hania 🤗💞'); });
    $('replayBtn').addEventListener('click', () => {
      tries = 0; msgIdx = 0; mainText.innerHTML = messages[0]; mood.textContent = '🥺'; bar.style.width = '0';
      clickCount.textContent = ''; noBtn.textContent = noLabels[0]; noBtn.style.transform = '';
      document.documentElement.style.setProperty('--ys', 1);
      $('after').classList.add('hidden'); $('card').classList.remove('hidden');
      document.body.style.alignItems = ''; placeNo(false);
    });
  </script>
</body>

</html>
